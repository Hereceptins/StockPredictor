name: StockPredictor
options:
  bundleIdPrefix: com.stockpredictor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOSTRING_FILE: YES

targets:
  StockPredictor:
    type: application
    platform: iOS
    sources:
      - path: .
        type: group
        excludes:
          - "project.yml"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockpredictor.app
        PRODUCT_NAME: "智选K线"
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_TEAM: ""  # 填入你的Apple Developer Team ID
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOSTRING_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: SwiftData.framework
      - sdk: SwiftUI.framework
      - sdk: CoreML.framework
      - sdk: NaturalLanguage.framework
      - sdk: WebKit.framework
      - sdk: Charts.framework
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false

  StockPredictorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockpredictor.tests
        GENERATE_INFOSTRING_FILE: YES
    dependencies:
      - target: StockPredictor
