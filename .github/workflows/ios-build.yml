name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CONFIGURATION_BUILD_DIR=build/App

      - name: Fake-sign binary
        run: |
          APP_PATH=$(find build/App -name "*.app" -type d | head -1)
          echo "App: $APP_PATH"
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null)
          echo "Executable: $EXEC"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP_PATH" 2>&1 || echo "codesign skipped"
          brew install ldid 2>/dev/null && ldid -S "$APP_PATH/$EXEC" 2>&1 || echo "ldid skipped"

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App -name "*.app" -type d | head -1)
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -y StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: build/StockPredictor.ipa
