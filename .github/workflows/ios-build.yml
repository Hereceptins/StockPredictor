name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -m1 "iPhone 16" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$SIM_ID" ]; then
            # fallback to iPhone 15 Pro
            SIM_ID=$(xcrun simctl list devices available iPhone | grep -m1 "iPhone 15" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Using simulator: $SIM_ID"
          xcodebuild build \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (无签名 IPA)
        run: |
          xcodebuild archive \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -archivePath build/StockPredictor.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R build/StockPredictor.xcarchive/Products/Applications/StockPredictor.app build/Payload/
          cd build && zip -r StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: build/StockPredictor.ipa

      - name: Build Summary
        run: |
          echo "### iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download IPA from Artifacts below." >> $GITHUB_STEP_SUMMARY
          echo "Install via AltStore / SideStore / 爱思助手" >> $GITHUB_STEP_SUMMARY
