name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (Xcode auto-completes Info.plist)
        run: |
          xcodebuild archive \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -archivePath build/StockPredictor.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract App from Archive (has complete Info.plist)
        run: |
          APP=$(find build/StockPredictor.xcarchive -name "*.app" -type d | head -1)
          echo "Found: $APP"
          # 验证 Info.plist 是否完整
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null && echo "MinOSVersion OK" || echo "Missing MinimumOSVersion"

      - name: Package IPA
        run: |
          mkdir -p build/Payload build/export
          APP=$(find build/StockPredictor.xcarchive -name "*.app" -type d | head -1)
          cp -R "$APP" build/Payload/
          cd build && zip -r -y export/StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: |
            build/export/*.ipa
            build/StockPredictor.ipa
