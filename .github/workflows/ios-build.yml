name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Archive (无签名 IPA)
        run: |
          xcodebuild archive \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -archivePath build/StockPredictor.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R build/StockPredictor.xcarchive/Products/Applications/StockPredictor.app build/Payload/
          cd build && zip -r StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: build/StockPredictor.ipa
