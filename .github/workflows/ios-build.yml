name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/App

      - name: Fake-sign with ldid (bypasses iOS 18.5 SDK restriction)
        run: |
          brew install ldid
          APP=$(find build/App -name "*.app" -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "App: $APP, Exec: $EXEC"
          ldid -S "$APP/$EXEC"
          echo "ldid done"

      - name: Package IPA
        run: |
          rm -rf build/Payload build/export
          mkdir -p build/Payload build/export
          APP=$(find build/App -name "*.app" -type d | head -1)
          cp -R "$APP" build/Payload/
          cd build && zip -r -y export/StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: |
            build/export/*.ipa
            build/StockPredictor.ipa
