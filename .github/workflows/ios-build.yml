name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=build/App

      - name: Ad-hoc sign
        run: |
          APP_PATH=$(find build/App -name "*.app" -type d | head -1)
          echo "App: $APP_PATH"
          /usr/bin/codesign -f -s - --entitlements Entitlements.plist "$APP_PATH" 2>&1 || true
          echo "Signing done"

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App -name "*.app" -type d | head -1)
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: build/StockPredictor.ipa
