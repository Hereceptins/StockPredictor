name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-15  # GitHub Actions 免费 Mac 运行器

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator (验证编译)
        run: |
          xcodebuild build \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: Archive (无签名 IPA)
        run: |
          xcodebuild archive \
            -project StockPredictor.xcodeproj \
            -scheme StockPredictor \
            -archivePath build/StockPredictor.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R build/StockPredictor.xcarchive/Products/Applications/StockPredictor.app build/Payload/
          cd build && zip -r StockPredictor.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor.ipa
          path: build/StockPredictor.ipa

      - name: Build Summary
        run: |
          echo "### iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download the IPA artifact below." >> $GITHUB_STEP_SUMMARY
          echo "Install via: Xcode → Devices → Drag IPA, or AltStore/SideStore" >> $GITHUB_STEP_SUMMARY
